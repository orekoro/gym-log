<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>gym-log</title>
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="gym-log">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg: #0f1115;
  --card: #1a1d24;
  --card2: #232731;
  --line: #2e333f;
  --text: #f2f3f5;
  --muted: #9aa1ae;
  --accent: #4ade80;
  --accent-ink: #06240f;
  --danger: #f87171;
  --radius: 14px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  padding: env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom));
  min-height: 100vh;
}
header {
  position: sticky; top: 0; z-index: 5;
  background: var(--bg);
  padding: 14px 16px 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  border-bottom: 1px solid var(--line);
}
h1 { font-size: 24px; margin: 0; font-weight: 700; }
h2 { font-size: 20px; margin: 0; }
main { padding: 16px; max-width: 640px; margin: 0 auto; }
button, input { font: inherit; color: inherit; }
button {
  border: 0; border-radius: var(--radius); cursor: pointer;
  min-height: 48px; padding: 0 18px; background: var(--card2);
}
button:active { transform: scale(.97); }
.primary { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.ghost { background: transparent; color: var(--muted); }
.danger { color: var(--danger); }
.wide { width: 100%; }
input {
  background: var(--card2); border: 1px solid var(--line); border-radius: 12px;
  min-height: 48px; padding: 0 14px; width: 100%; outline: none;
}
input:focus { border-color: var(--accent); }
input[type=date] { width: auto; min-width: 150px; }
.card {
  background: var(--card); border-radius: var(--radius);
  padding: 14px; margin-bottom: 14px; border: 1px solid var(--line);
}
.row { display: flex; gap: 10px; align-items: center; }
.ex-head { position: relative; display: flex; gap: 8px; align-items: center; }
.ex-name { font-weight: 600; font-size: 18px; }
.icon-btn { min-width: 48px; padding: 0; background: transparent; color: var(--muted); font-size: 22px; }
.last {
  margin: 10px 0 4px; padding: 10px 12px; border-radius: 10px;
  background: #13261a; color: #bbf7d0; font-size: 15px;
}
.last b { color: var(--accent); }
.last.none { background: var(--card2); color: var(--muted); }
.sets-head, .set {
  display: grid; grid-template-columns: 36px 1fr 1fr 44px; gap: 8px; align-items: center;
}
.sets-head { color: var(--muted); font-size: 13px; margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .04em; }
.set { margin-bottom: 8px; }
.set-no { color: var(--muted); text-align: center; font-weight: 600; }
.set input { text-align: center; font-size: 20px; font-weight: 600; padding: 0 6px; }
.suggest {
  position: absolute; left: 0; right: 56px; top: 52px; z-index: 4;
  background: var(--card2); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,.5);
}
.suggest button {
  display: block; width: 100%; text-align: left; border-radius: 0; background: transparent;
  border-bottom: 1px solid var(--line);
}
.suggest button:last-child { border-bottom: 0; }
.muted { color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 40px 10px; }
.list-item {
  width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center;
  background: var(--card); border: 1px solid var(--line); margin-bottom: 10px; min-height: 64px;
}
.list-item small { color: var(--muted); display: block; font-size: 14px; }
.session { padding: 12px 14px; }
.session-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { background: var(--card2); border-radius: 8px; padding: 4px 10px; font-size: 15px; font-weight: 600; }
nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: #12151b; border-top: 1px solid var(--line);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
}
nav button { background: transparent; color: var(--muted); font-size: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 58px; }
nav button span { font-size: 22px; line-height: 1; }
nav button.on { color: var(--accent); }
.stack > * + * { margin-top: 12px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--card2); border-radius: 12px; padding: 4px; }
.seg button { min-height: 40px; padding: 0 8px; background: transparent; color: var(--muted); font-size: 15px; border-radius: 9px; }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.chart-wrap { margin: 12px 0 4px; }
.chart-wrap svg { display: block; width: 100%; height: auto; touch-action: manipulation; }
.chart-info { min-height: 24px; font-size: 15px; color: var(--muted); text-align: center; }
.chart-info b { color: var(--text); }
.chart-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; text-align: center; }
.chart-stats div { background: var(--card2); border-radius: 10px; padding: 8px 4px; }
.chart-stats small { display: block; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.chart-stats b { font-size: 17px; }
.up { color: var(--accent); } .down { color: var(--danger); }
textarea { font: inherit; color: inherit; background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; width: 100%; resize: none; outline: none; min-height: 48px; }
textarea:focus { border-color: var(--accent); }
.day-card { display: flex; flex-direction: column; gap: 10px; }
.day-row { display: flex; align-items: center; gap: 10px; }
.day-label { color: var(--muted); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; min-width: 44px; }
.split-chips { margin-top: -2px; }
.chip-btn { min-height: 34px; padding: 0 12px; border-radius: 999px; font-size: 14px; background: var(--card2); color: var(--muted); border: 1px solid var(--line); }
.split-tag { background: #13261a; color: var(--accent); border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.pick-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sheet { max-height: 80vh; overflow-y: auto; }
.pick-list { display: flex; flex-direction: column; gap: 8px; }
.pick { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; padding: 12px 14px; background: var(--card2); font-size: 15px; }
.save-btn { margin-top: 12px; background: transparent; color: var(--accent); border: 2px solid var(--accent); font-weight: 700; }
.saved-icon { width: 56px; height: 56px; margin: 0 auto 10px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.tile small { display: block; color: var(--muted); font-size: 14px; margin-bottom: 4px; }
.tile b { font-size: 30px; font-variant-numeric: tabular-nums; }
.stat-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.stat-head b { font-size: 17px; }
.stat-head .muted { font-size: 13px; }
.link-btn { min-height: 36px; padding: 0 8px; color: var(--accent); font-weight: 600; font-size: 15px; }
.hm-scroll { overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.hm-scroll::-webkit-scrollbar { display: none; }
.hm-months, .hm-grid { display: grid; grid-template-columns: repeat(53, 12px); gap: 3px; width: max-content; }
.hm-months { font-size: 11px; color: var(--muted); margin-bottom: 4px; height: 14px; }
.hm-months span { white-space: nowrap; overflow: visible; }
.hm-col { display: grid; grid-template-rows: repeat(7, 12px); gap: 3px; }
.hm-col i, .hm-legend i { display: block; width: 12px; height: 12px; border-radius: 3px; }
.hm-0 { background: var(--card2); } .hm-1 { background: #1d4a2c; } .hm-2 { background: #26773f; } .hm-3 { background: #34a856; } .hm-4 { background: #4ade80; }
.hm-col .hm-x { background: transparent; } .hm-today { outline: 2px solid var(--accent); outline-offset: -1px; }
.hm-legend { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 10px; font-size: 13px; color: var(--muted); }
.hm-legend span { margin: 0 4px; }
.bw-list { margin-top: 10px; border-top: 1px solid var(--line); }
.bw-row { display: grid; grid-template-columns: 1fr auto 44px; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); font-size: 15px; }
.bw-row:last-child { border-bottom: 0; }
.bw-row span { color: var(--muted); }
.ep-list { display: flex; flex-direction: column; margin-top: 8px; }
.ep-row { display: grid; grid-template-columns: minmax(0, 1fr) 90px 74px; align-items: center; gap: 10px; background: transparent; border-radius: 0; border-bottom: 1px solid var(--line); padding: 8px 2px; text-align: left; min-height: 58px; }
.ep-row:last-child { border-bottom: 0; }
.ep-name b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ep-name small, .ep-val small { color: var(--muted); font-size: 13px; }
.ep-val { text-align: right; font-variant-numeric: tabular-nums; }
.ep-val small.up, .ep-val small.down, .ep-val small.muted { display: block; }
.ep-val small.up { color: var(--accent); } .ep-val small.down { color: var(--danger); }
.spark { width: 90px; height: 30px; display: block; }
.wk-item { width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; }
.wk-sum { font-size: 15px; font-variant-numeric: tabular-nums; }
.wk-ex { font-size: 14px; }
.wk-note { font-size: 14px; color: var(--muted); font-style: italic; }
.wk-ex-card { width: 100%; text-align: left; display: block; margin: 0; }
.badge { border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.badge.pr { background: #3a2c0a; color: #fbbf24; }
.badge.up-b { background: #13261a; color: var(--accent); }
.pr-box { background: #2a2208; color: #fde68a; } .pr-box b { color: #fbbf24; }
.nag { width: 100%; text-align: left; background: #2a2208; color: #fde68a; border: 1px solid #5b4710; border-radius: 12px; font-size: 15px; padding: 10px 14px; min-height: 44px; margin-bottom: 14px; }
.timer { color: var(--accent); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
.cues { margin: 8px 0 4px; background: #16202e; border: 1px solid #243450; border-radius: 10px; padding: 4px 12px 8px; }
.cues-head { display: flex; justify-content: space-between; align-items: center; }
.cues-toggle, .cues-edit { min-height: 36px; padding: 0; font-size: 15px; font-weight: 700; color: #93c5fd; background: transparent; }
.cues-edit { font-weight: 600; color: var(--muted); }
.cues ul { margin: 2px 0 2px; padding-left: 20px; color: #dbe7f7; font-size: 15px; }
.cues li + li { margin-top: 4px; }
.cue-add { min-height: 36px; padding: 0 2px; font-size: 14px; color: #93c5fd; }
.modal-bg { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 24px; }
.modal { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; width: 100%; max-width: 360px; }
.modal p { margin: 0 0 18px; font-size: 18px; font-weight: 600; text-wrap: balance; }
.danger-fill { background: var(--danger); color: #2a0707; font-weight: 700; }
.section-label { color: var(--muted); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin: 4px 2px 8px; }
.done-row {
  width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px 14px; margin-bottom: 8px; min-height: 64px;
}
.dr-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.dr-text b { font-size: 17px; }
.dr-sets { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
.dr-edit { color: var(--accent); font-size: 15px; font-weight: 600; }
.open-card { border-color: var(--accent); }
.open-card + .section-label, .done-row + .section-label { margin-top: 18px; }
.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--accent); color: var(--accent-ink); font-weight: 700;
  padding: 12px 18px; border-radius: 12px; z-index: 20;
}
</style>
</head>
<body>
<div id="app"></div>
<nav>
  <button data-tab="stats"><span>📊</span>Stats</button>
  <button data-tab="log"><span>🏋️</span>Log</button>
  <button data-tab="history"><span>📈</span>History</button>
  <button data-tab="backup"><span>💾</span>Backup</button>
</nav>
<script>
"use strict";
/* ---------- storage ---------- */
const KEY = "gymlog.v1";
let db = load();
function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && Array.isArray(d.workouts)) return d; } catch (e) {}
  return { workouts: [] };
}
function save() {
  db.workouts = db.workouts.filter(w => w.exercises.length || (w.split || "").trim() || (w.note || "").trim());
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast("Could not save!"); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const norm = s => (s || "").trim().replace(/\s+/g, " ").toLowerCase();
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fmtDate = iso => new Date(iso + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
const fmtShort = iso => new Date(iso + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtSet = s => {
  const r = s.reps === "" || s.reps == null ? "?" : s.reps;
  const w = s.weight === "" || s.weight == null || Number(s.weight) === 0 ? "BW" : s.weight + " kg";
  return `${r} × ${w}`;
};
const filledSets = sets => sets.filter(s => s.reps !== "" || s.weight !== "");

/* ---------- state ---------- */
let tab = "log";
let logDate = today();
// workouts from earlier days count as saved
db.workouts.forEach(w => { if (!w.savedAt && w.date < today()) w.savedAt = new Date(w.date + "T20:00:00").getTime(); });
let historyW = null; // id of a workout open in History
let historyEx = null; // normalized name or null
const PREF = "gymlog.prefs";
let prefs = (() => { try { return JSON.parse(localStorage.getItem(PREF)) || {}; } catch (e) { return {}; } })();
prefs.group = prefs.group || "day";
function savePrefs() { try { localStorage.setItem(PREF, JSON.stringify(prefs)); } catch (e) {} }

/* ---------- charts ---------- */
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const METRICS = {
  weight: { label: "Heaviest", unit: "kg", per: sets => Math.max(0, ...sets.map(s => num(s.weight))), agg: "max" },
  volume: { label: "Volume", unit: "kg", per: sets => sets.reduce((t, s) => t + num(s.reps) * num(s.weight), 0), agg: "sum" },
  reps:   { label: "Most reps", unit: "reps", per: sets => Math.max(0, ...sets.map(s => num(s.reps))), agg: "max" }
};
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function periodOf(date, group) {
  if (group === "year") return { key: date.slice(0, 4), label: date.slice(0, 4), long: date.slice(0, 4) };
  if (group === "month") { const m = MONTHS[+date.slice(5, 7) - 1]; return { key: date.slice(0, 7), label: m, long: `${m} ${date.slice(0, 4)}` }; }
  return { key: date, label: fmtShort(date), long: fmtDate(date) };
}
function chartPoints(key, metric, group) {
  const m = METRICS[metric], map = new Map();
  sessionsOf(key).slice().reverse().forEach(({ w, e }) => {
    const sets = filledSets(e.sets); if (!sets.length) return;
    const v = m.per(sets), p = periodOf(w.date, group);
    const cur = map.get(p.key);
    if (!cur) map.set(p.key, { ...p, v, n: 1 });
    else { cur.v = m.agg === "sum" ? cur.v + v : Math.max(cur.v, v); cur.n++; }
  });
  return [...map.values()];
}
const fmtNum = v => (Math.round(v * 10) / 10).toLocaleString("en-GB").replace(/,/g, " ");
function niceTicks(min, max) {
  if (min === max) { min = Math.max(0, min - 1); max = max + 1; }
  const raw = (max - min) / 3, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(f => f * mag).find(s => s >= raw);
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, ticks = [];
  for (let t = lo; t <= hi + step / 2; t += step) ticks.push(Math.round(t * 100) / 100);
  return ticks;
}
function chartSvg(pts, unit, goal) {
  const W = 340, H = 190, L = 44, R = 12, T = 14, B = 30;
  const vals = pts.map(p => p.v).concat(goal > 0 ? [goal] : []), ticks = niceTicks(Math.min(...vals), Math.max(...vals));
  const lo = ticks[0], hi = ticks[ticks.length - 1];
  const x = i => pts.length === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (pts.length - 1);
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo || 1));
  const grid = ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="#2e333f"/>
    <text x="${L - 6}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="#9aa1ae">${fmtNum(t)}</text>`).join("");
  const every = Math.max(1, Math.ceil(pts.length / 5));
  const lastI = pts.length - 1;
  const showLabel = i => i === lastI || (i % every === 0 && (i === 0 || lastI - i >= every * 1.2));
  const xl = pts.map((p, i) => showLabel(i)
    ? `<text x="${x(i)}" y="${H - 8}" text-anchor="${pts.length > 1 && i === lastI ? "end" : pts.length > 1 && i === 0 ? "start" : "middle"}" font-size="11" fill="#9aa1ae">${esc(p.label)}</text>` : "").join("");
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  const area = pts.length > 1 ? `<path d="${line} L${x(pts.length - 1)},${H - B} L${x(0)},${H - B} Z" fill="#4ade80" opacity=".12"/>` : "";
  const dots = pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.v)}" r="${pts.length > 30 ? 3 : 5}" fill="#4ade80" stroke="#1a1d24" stroke-width="2"/>
    <rect data-i="${i}" x="${x(i) - 14}" y="${T}" width="28" height="${H - T - B}" fill="transparent"/>`).join("");
  const gl = goal > 0 ? `<line x1="${L}" x2="${W - R}" y1="${y(goal)}" y2="${y(goal)}" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="${W - R}" y="${y(goal) - 5}" text-anchor="end" font-size="11" fill="#fbbf24">Goal ${fmtNum(goal)}</text>` : "";
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress chart in ${unit}">${grid}${area}${gl}
    <path d="${line}" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xl}</svg>`;
}
let curMetric = "weight";
function chartHtml(key) {
  const anyWeight = sessionsOf(key).some(s => s.e.sets.some(x => num(x.weight) > 0));
  const metric = curMetric = anyWeight ? (prefs.metric || "weight") : "reps";
  const group = prefs.group, m = METRICS[metric];
  const pts = chartPoints(key, metric, group);
  const metricBtns = (anyWeight ? ["weight", "volume", "reps"] : ["reps"])
    .map(k => `<button data-metric="${k}" class="${k === metric ? "on" : ""}">${METRICS[k].label}</button>`).join("");
  const groupBtns = [["day", "Day"], ["month", "Month"], ["year", "Year"]]
    .map(([k, l]) => `<button data-group="${k}" class="${k === group ? "on" : ""}">${l}</button>`).join("");
  let body;
  if (pts.length < 2) body = `<div class="empty" style="padding:24px 10px">Log this exercise in at least 2 different ${group === "day" ? "sessions" : group + "s"} to see a trend.</div>`;

      ${exs.length ? `<button class="ghost danger wide" id="del-workout" style="margin-top:20px">Delete this whole workout</button>` : ""}
    </main>`;

  document.getElementById("date").onchange = ev => { closeOpen(); const v = ev.target.value || today(), x = cur(false); if (x) x.date = v; logDate = v; save(); render(); };
  const splitIn = document.getElementById("split"), noteIn = document.getElementById("note");
  const grow = () => { noteIn.style.height = "auto"; noteIn.style.height = noteIn.scrollHeight + 2 + "px"; };

  const rp = document.getElementById("repeat");
  if (rp) rp.onclick = repeatPicker;
  const addBtn = document.getElementById("add-ex");
  if (addBtn) addBtn.onclick = () => {
    const ex = { id: uid(), name: "", sets: [{ reps: "", weight: "" }] };
    cur(true).exercises.push(ex); openEx = ex.id;
    save(); render();
    const el = app.querySelector("[data-autofocus]"); if (el) el.focus();
  };
  app.querySelectorAll("[data-open]").forEach(b => b.onclick = () => {
    closeOpen(); openEx = b.dataset.open; render();
    const c = app.querySelector(".open-card"); if (c) c.scrollIntoView({ block: "center", behavior: "smooth" });
  });
  const dw = document.getElementById("del-workout");
  if (dw) dw.onclick = async () => {
    if (!(await ask(`Delete this whole workout?`))) return;
    const cw = cur(false); db.workouts = db.workouts.filter(x => x !== cw); editWid = null; logDate = today(); save(); render();
  };

  app.querySelectorAll("[data-ex]").forEach(card => {
    const ex = w.exercises.find(x => x.id === card.dataset.ex);
    const nameIn = card.querySelector(".ex-name");
    const head = card.querySelector(".ex-head");
    const wireCues = () => {
      const t = card.querySelector('[data-act="toggle-cues"]'); if (t) t.onclick = () => { prefs.cuesOpen = prefs.cuesOpen === false; savePrefs(); card.querySelector(".cues-wrap").innerHTML = cuesHtml(ex.name); wireCues(); };
      const e2 = card.querySelector('[data-act="edit-cues"]'); if (e2) e2.onclick = () => { ex.name = ex.name.trim(); save(); editCues(ex.name); };
    };
    wireCues();
    const updateLast = () => { card.querySelector(".last-wrap").innerHTML = lastHtml(ex.name, logDate); card.querySelector(".cues-wrap").innerHTML = cuesHtml(ex.name); wireCues(); };
    const closeSuggest = () => { const s = head.querySelector(".suggest"); if (s) s.remove(); };
    const showSuggest = () => {
      closeSuggest();
      const q = norm(nameIn.value);
      const used = new Set(w.exercises.filter(x => x !== ex).map(x => norm(x.name)));
      const list = allNames().filter(n => !used.has(n.key) && n.key !== q && (!q || n.key.includes(q))).slice(0, 6);
      if (!list.length) return;
      const box = document.createElement("div"); box.className = "suggest";
      list.forEach(n => {
        const b = document.createElement("button"); b.type = "button"; b.textContent = n.name;
        b.addEventListener("pointerdown", ev => ev.preventDefault());
        b.onclick = () => { nameIn.value = n.name; ex.name = n.name; save(); closeSuggest(); updateLast(); nameIn.blur(); };
        box.appendChild(b);
      });
      head.appendChild(box);
    };
    nameIn.addEventListener("input", () => { ex.name = nameIn.value; save(); showSuggest(); updateLast(); });
    nameIn.addEventListener("focus", showSuggest);
    nameIn.addEventListener("blur", () => { setTimeout(closeSuggest, 150); ex.name = nameIn.value.trim().replace(/\s+/g, " "); nameIn.value = ex.name; save(); });

    card.querySelectorAll(".set").forEach(row => {
      const j = +row.dataset.set;
      row.querySelectorAll("input").forEach(inp => inp.addEventListener("input", () => {
        ex.sets[j][inp.dataset.f] = inp.value.replace(",", ".").trim(); markStart(); save();
      }));
      row.querySelector('[data-act="del-set"]').onclick = async () => {
        const s = ex.sets[j];
        if ((s.reps !== "" || s.weight !== "") && !(await ask(`Delete set ${j + 1} (${fmtSet(s)})?`))) return;
        ex.sets.splice(j, 1); save(); render();
      };
    });
    card.querySelector('[data-act="done"]').onclick = () => { closeOpen(); render(); window.scrollTo(0, 0); };
    card.querySelector('[data-act="add-set"]').onclick = () => {
      const prev = ex.sets[ex.sets.length - 1];
      ex.sets.push(prev ? { reps: prev.reps, weight: prev.weight } : { reps: "", weight: "" });
      save(); render();
    };
    card.querySelector('[data-act="del-ex"]').onclick = async () => {
      if ((ex.name || filledSets(ex.sets).length) && !(await ask(`Delete ${ex.name || "this exercise"} and all its sets?`))) return;
      w.exercises = w.exercises.filter(x => x !== ex); save(); render();
    };
  });
}

/* ---------- stats ---------- */
const isoD = d => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); };
const dayDiff = (a, b) => Math.round((new Date(a + "T12:00:00") - new Date(b + "T12:00:00")) / 864e5);
function weekStart(iso) { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return isoD(d); }
function trained() { return db.workouts.filter(w => w.exercises.some(e => filledSets(e.sets).length)); }
function weekStreak() {
  const weeks = new Set(trained().map(w => weekStart(w.date)));
  let wk = weekStart(today()), n = 0;
  const prev = iso => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() - 7); return isoD(d); };
  if (!weeks.has(wk)) wk = prev(wk);
  while (weeks.has(wk)) { n++; wk = prev(wk); }
  return n;
}
const dayValue = (w, m) => m === "time" ? (w.minutes || 0) : w.exercises.reduce((t, e) => t + filledSets(e.sets).reduce((a, x) => a + (m === "volume" ? num(x.reps) * num(x.weight) : 1), 0), 0);
function heatmapHtml() {
  const m = prefs.heat || "sets", byDay = new Map();
  trained().forEach(w => byDay.set(w.date, (byDay.get(w.date) || 0) + dayValue(w, m)));
  const noTime = m === "time" && ![...byDay.values()].some(v => v > 0);
  const end = today(), start = new Date(weekStart(end) + "T12:00:00"); start.setDate(start.getDate() - 7 * 52);
  const vals = [...byDay.values()].filter(v => v > 0).sort((a, b) => a - b);
  const q = f => vals.length ? vals[Math.min(vals.length - 1, Math.floor(f * vals.length))] : 1;
  const cuts = [q(.25), q(.5), q(.75)];
  const lvl = v => !v ? 0 : v <= cuts[0] ? 1 : v <= cuts[1] ? 2 : v <= cuts[2] ? 3 : 4;
  let cols = "", months = "", lastM = -1;
  for (let c = 0; c < 53; c++) {
    let cells = "";
    const d0 = new Date(start); d0.setDate(d0.getDate() + c * 7);
    const mo = d0.getMonth();
    months += `<span>${mo !== lastM && d0.getDate() <= 7 ? MONTHS[mo] : ""}</span>`; if (d0.getDate() <= 7) lastM = mo;
    for (let r = 0; r < 7; r++) {
      const d = new Date(d0); d.setDate(d.getDate() + r); const iso = isoD(d);
      if (iso > end) { cells += `<i class="hm-x"></i>`; continue; }
      const v = byDay.get(iso) || 0;
      cells += `<i class="hm-${lvl(v)}${iso === end ? " hm-today" : ""}" title="${fmtShort(iso)}${v ? `: ${m === "time" ? fmtDur(v) : `${fmtNum(v)} ${m === "volume" ? "kg" : "sets"}`}` : ""}"></i>`;
    }
    cols += `<div class="hm-col">${cells}</div>`;
  }
  return `<div class="card">
    <div class="stat-head"><b>Activity</b><span class="muted">last 12 months</span></div>
    <div class="seg" style="margin:10px 0 12px"><button data-heat="sets" class="${m === "sets" ? "on" : ""}">Sets</button><button data-heat="volume" class="${m === "volume" ? "on" : ""}">Volume</button><button data-heat="time" class="${m === "time" ? "on" : ""}">Time</button></div>
    <div class="hm-scroll" id="hm-scroll"><div class="hm-months">${months}</div><div class="hm-grid">${cols}</div></div>
    ${noTime ? `<p class="muted" style="font-size:13px;margin:8px 0 0">Time is recorded from now on: from your first set until you tap Save workout.</p>` : ""}
    <div class="hm-legend"><span>Less</span><i class="hm-0"></i><i class="hm-1"></i><i class="hm-2"></i><i class="hm-3"></i><i class="hm-4"></i><span>More</span></div>
  </div>`;
}
function bwInRange() {
  const days = { "1m": 31, "3m": 92, "1y": 366 }[prefs.bwRange || "3m"];
  return (db.bodyweight || []).slice().sort((a, b) => a.date.localeCompare(b.date)).filter(e => !days || dayDiff(today(), e.date) <= days);
}
function bodyweightHtml() {
  const bw = (db.bodyweight || []).slice().sort((a, b) => a.date.localeCompare(b.date));
  const range = prefs.bwRange || "3m";
  const pts = bwInRange().map(e => ({ label: fmtShort(e.date), v: e.kg }));
  const goal = num(db.goalWeight), latest = bw[bw.length - 1];
  return `<div class="card" id="bw-card">
    <div class="stat-head"><b>Body weight</b><span class="row" style="gap:4px"><button class="ghost link-btn" id="bw-goal">◎ Goal</button><button class="ghost link-btn" id="bw-log">+ Log</button></span></div>
    <div class="seg" style="margin:10px 0 4px">${[["1m", "1M"], ["3m", "3M"], ["1y", "1Y"], ["all", "All"]].map(([k, l]) => `<button data-bw="${k}" class="${k === range ? "on" : ""}">${l}</button>`).join("")}</div>
    ${pts.length ? `<div class="chart-wrap">${chartSvg(pts, "kg", goal)}</div><div class="chart-info" id="bw-info">Latest: <b>${fmtNum(latest.kg)} kg</b> on ${fmtShort(latest.date)}${goal ? ` · ${fmtNum(Math.abs(latest.kg - goal))} kg to goal` : ""}</div>`
      : `<div class="empty" style="padding:28px 10px">${bw.length ? "No weigh-ins in this period." : "No weigh-ins yet. Tap “+ Log” to add today’s weight."}</div>`}
    ${bw.length ? `<div class="bw-list">${bw.slice(-4).reverse().map(e => `<div class="bw-row"><span>${fmtDate(e.date)}</span><b>${fmtNum(e.kg)} kg</b><button class="icon-btn" data-bwdel="${e.date}" aria-label="Delete weigh-in">✕</button></div>`).join("")}</div>` : ""}
  </div>`;
}
function exerciseProgressHtml() {
  const rows = allNames().map(n => {
    const s = sessionsOf(n.key).filter(x => filledSets(x.e.sets).length).reverse();
    const anyW = s.some(x => x.e.sets.some(y => num(y.weight) > 0));
    const vals = s.map(x => Math.max(0, ...filledSets(x.e.sets).map(y => num(anyW ? y.weight : y.reps))));
    return { ...n, vals, unit: anyW ? "kg" : "reps", count: s.length };
  }).filter(r => r.count >= 2).sort((a, b) => b.count - a.count).slice(0, 8);
  if (!rows.length) return `<div class="card"><div class="stat-head"><b>Exercise progress</b></div><p class="muted" style="margin:8px 0 0">Log an exercise in two workouts and its progress curve shows up here.</p></div>`;
  const spark = v => {
    const vs = v.slice(-12), lo = Math.min(...vs), hi = Math.max(...vs), W = 90, H = 30;
    const px = i => (i * W / (vs.length - 1 || 1)).toFixed(1), py = x => (H - 4 - (H - 8) * (hi === lo ? .5 : (x - lo) / (hi - lo))).toFixed(1);
    const L = vs.length - 1;
    return `<svg viewBox="-4 0 ${W + 8} ${H}" class="spark" aria-hidden="true"><polyline points="${vs.map((x, i) => px(i) + "," + py(x)).join(" ")}" fill="none" stroke="#4ade80" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${px(L)}" cy="${py(vs[L])}" r="3" fill="#4ade80"/></svg>`;
  };
  return `<div class="card"><div class="stat-head"><b>Exercise progress</b><span class="muted">best set per session</span></div>
    <div class="ep-list">${rows.map(r => { const d = r.vals[r.vals.length - 1] - r.vals[0]; return `<button class="ep-row" data-ep="${esc(r.key)}">
      <span class="ep-name"><b>${esc(r.name)}</b><small>${r.count} sessions</small></span>${spark(r.vals)}
      <span class="ep-val"><b>${fmtNum(r.vals[r.vals.length - 1])}</b> <small>${r.unit}</small><small class="${d > 0 ? "up" : d < 0 ? "down" : "muted"}">${d > 0 ? "▲ +" : d < 0 ? "▼ " : ""}${d ? fmtNum(d) : "–"}</small></span></button>`; }).join("")}</div></div>`;
}
function renderStats() {
  const t = trained(), month = today().slice(0, 7);
  const bw = (db.bodyweight || []).slice().sort((a, b) => a.date.localeCompare(b.date));
  let w30 = "–", w30c = "";
  if (bw.length) {
    const last = bw[bw.length - 1], base = bw.find(e => dayDiff(last.date, e.date) <= 30);
    if (base !== last) { const d = last.kg - base.kg; w30 = `${d > 0 ? "+" : ""}${fmtNum(d)}`; }
  }
  app.innerHTML = `
    <header><div><h1>Stats</h1><div class="muted" style="font-size:15px">Progress and history</div></div></header>
    <main class="stack">
      <div class="tiles">
        <div class="tile"><small>🏋️ Workouts</small><b>${t.length}</b></div>
        <div class="tile"><small>📅 This month</small><b>${t.filter(w => w.date.startsWith(month)).length}</b></div>
        <div class="tile"><small>🔥 Week streak</small><b>${weekStreak()}</b></div>
        <div class="tile"><small>⚖️ Weight 30d</small><b>${w30}</b>${w30 !== "–" ? ` <span class="muted">kg</span>` : ""}</div>
      </div>
      ${heatmapHtml()}
      ${bodyweightHtml()}
      ${exerciseProgressHtml()}
    </main>`;
  const sc = document.getElementById("hm-scroll"); if (sc) sc.scrollLeft = sc.scrollWidth;
  app.querySelectorAll("[data-heat]").forEach(b => b.onclick = () => { prefs.heat = b.dataset.heat; savePrefs(); render(); });
  app.querySelectorAll("[data-bw]").forEach(b => b.onclick = () => { prefs.bwRange = b.dataset.bw; savePrefs(); render(); });
  app.querySelectorAll("[data-ep]").forEach(b => b.onclick = () => { tab = "history"; historyEx = b.dataset.ep; render(); window.scrollTo(0, 0); });
  app.querySelectorAll("[data-bwdel]").forEach(b => b.onclick = async () => {
    if (!(await ask(`Delete the weigh-in from ${fmtDate(b.dataset.bwdel)}?`))) return;
    db.bodyweight = db.bodyweight.filter(e => e.date !== b.dataset.bwdel); save(); render();
  });
  document.getElementById("bw-log").onclick = logWeight;
  document.getElementById("bw-goal").onclick = async () => {
    const v = await askText("Goal weight in kg (leave empty to remove)", db.goalWeight ? String(db.goalWeight) : "", "Save goal");
    if (v == null) return;
    const g = parseFloat(v.replace(",", "."));
    db.goalWeight = g > 0 ? g : null; save(); render();
  };
  const pts = bwInRange(), info = document.getElementById("bw-info");
  document.querySelectorAll("#bw-card rect[data-i]").forEach(r => r.addEventListener("click", () => { const e = pts[+r.dataset.i]; info.innerHTML = `<b>${fmtDate(e.date)}:</b> ${fmtNum(e.kg)} kg`; }));
}
function logWeight() {
  const last = (db.bodyweight || []).slice().sort((a, b) => a.date.localeCompare(b.date)).pop();
  const sh = sheet(`<p>Log body weight</p>
    <div class="row"><input id="bw-kg" inputmode="decimal" placeholder="kg" value="${last ? last.kg : ""}" style="font-size:22px;font-weight:600;text-align:center"><input type="date" id="bw-date" value="${today()}" max="${today()}"></div>
    <div class="row" style="margin-top:14px"><button class="wide" data-close>Cancel</button><button class="wide primary" id="bw-save">Save</button></div>`);
  const kg = sh.el.querySelector("#bw-kg"); kg.focus(); kg.select();
  const go = () => {
    const v = parseFloat(kg.value.replace(",", ".")), d = sh.el.querySelector("#bw-date").value || today();
    if (!(v > 0)) { kg.style.borderColor = "var(--danger)"; return; }
    db.bodyweight = (db.bodyweight || []).filter(e => e.date !== d); db.bodyweight.push({ date: d, kg: Math.round(v * 10) / 10 });
    save(); sh.close(); render(); toast(`Logged ${fmtNum(v)} kg`);
  };
  sh.el.querySelector("#bw-save").onclick = go;
  kg.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
}

function renderBackup() {
  const n = db.workouts.length;
  app.innerHTML = `
    <header><h1>Backup</h1></header>
    <main class="stack">
      <div class="card stack">
        <div><b>Export</b><br><span class="muted">Saves all ${n} workout${n === 1 ? "" : "s"} as one file. Save it to iCloud Drive or Files. ${db.lastBackup ? `Last backup: ${fmtDate(isoD(new Date(db.lastBackup)))}.` : "No backup yet."}</span></div>
        <button class="primary wide" id="export">Export backup</button>
      </div>
      <div class="card stack">
        <div><b>Import</b><br><span class="muted">Restores from a backup file. This replaces everything currently in the app.</span></div>
        <button class="wide" id="import">Import backup</button>
        <input type="file" id="file" accept=".json,application/json" hidden>
      </div>
      <p class="muted" style="font-size:14px">Your data is stored only on this phone. Deleting the app from your home screen erases it, so keep a recent backup.</p>
    </main>`;
  document.getElementById("export").onclick = async () => {
    const name = `gym-log-backup-${today()}.json`;
    const prevB = db.lastBackup; db.lastBackup = Date.now();
    const blob = new Blob([JSON.stringify(db, null, 1)], { type: "application/json" });
    const file = new File([blob], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name }); save(); toast("Backup saved"); render(); return; }
      catch (e) { if (e.name === "AbortError") { db.lastBackup = prevB; return; } }
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); save(); render();
  };
  const fileIn = document.getElementById("file");
  document.getElementById("import").onclick = () => fileIn.click();
  fileIn.onchange = () => {
    const f = fileIn.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = async () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.workouts)) throw 0;
        if (!(await ask(`Replace current data with ${d.workouts.length} workouts from this backup?`, "Replace"))) return;
        db = d; save(); toast("Backup restored"); render();
      } catch (e) { toast("That file isn't a gym-log backup"); }
    };
    r.readAsText(f);
  };
}

function ask(msg, yes = "Delete") {
  return new Promise(res => {
    const bg = document.createElement("div"); bg.className = "modal-bg";
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><p></p><div class="row"><button class="wide" data-r="0">Cancel</button><button class="wide ${yes === "Delete" ? "danger-fill" : "primary"}" data-r="1"></button></div></div>`;
    bg.querySelector("p").textContent = msg; bg.querySelector('[data-r="1"]').textContent = yes;
    const done = v => { bg.remove(); res(v); };
    bg.onclick = e => { if (e.target === bg) done(false); };
    bg.querySelectorAll("[data-r]").forEach(b => b.onclick = () => done(b.dataset.r === "1"));
    document.body.appendChild(bg); bg.querySelector('[data-r="0"]').focus();
  });
}
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2000);
}

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  if (tab === "log") closeOpen();
  if (editWid) { editWid = null; logDate = today(); }
  tab = b.dataset.tab; if (tab === "history") { historyEx = null; historyW = null; } if (tab === "log") logDate = logDate || today();
  render(); window.scrollTo(0, 0);
});
render();
setInterval(() => { const t = document.getElementById("timer"), w = tab === "log" && !editWid ? cur(false) : null; if (t && w && w.startedAt) t.textContent = "⏱ " + fmtDur(Math.max(0, Math.floor((Date.now() - w.startedAt) / 60000))); }, 30000);

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
